<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/Images/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preload" href="/src/assets/Images/Logo.png" as="image" type="image/png" />
    <title>Tread — Executive GST Invoicing, Accounting & Inventory Suite</title>
    <style>
      body {
        margin: 0;
        background-color: #090d16;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #0f172a;
        -webkit-tap-highlight-color: transparent;
        text-rendering: optimizeLegibility;
      }
      #box {
        background-color: #090d16;
        min-height: 54px;
        width: 100%;
      }
      /* Pre-hydration Zero-Blocking Instant Splash (Sub-80ms LCP) */
      #app-pre-splash {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center top, #1e293b 0%, #0f172a 50%, #090d16 100%);
        color: #ffffff;
        transition: opacity 0.3s ease;
      }
      .pre-splash-card {
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 2.5rem 2rem;
        text-align: center;
        max-width: 440px;
        width: 90%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .pre-splash-logo {
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: drop-shadow(0 10px 20px rgba(99, 102, 241, 0.45));
        margin-bottom: 1rem;
        animation: pre-pulse 1.8s infinite ease-in-out;
      }
      .pre-splash-title {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 4px 0;
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .pre-splash-sub {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
        margin: 0 0 1.25rem 0;
      }
      .pre-splash-bar {
        height: 5px;
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
      }
      .pre-splash-fill {
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #6366f1, #3b82f6, #10b981);
        border-radius: 999px;
        animation: pre-progress 1.4s infinite ease-in-out;
      }
      @keyframes pre-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.9; }
      }
      @keyframes pre-progress {
        0% { transform: translateX(-100%); width: 30%; }
        50% { transform: translateX(50%); width: 60%; }
        100% { transform: translateX(200%); width: 30%; }
      }
    </style>
  </head>
  <body>
    <!-- Instant Pre-React Brand Splash for zero CLS and instant LCP -->
    <div id="app-pre-splash">
      <div class="pre-splash-card">
        <img class="pre-splash-logo" src="/src/assets/Images/Logo.png" alt="Tread Logo" width="80" height="80" />
        <h1 class="pre-splash-title">TREAD</h1>
        <p class="pre-splash-sub">Executive GST Billing &amp; ERP Platform</p>
        <div class="pre-splash-bar">
          <div class="pre-splash-fill"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Gracefully fade and remove the pre-splash when React mounts
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          var el = document.getElementById('app-pre-splash');
          if (el) {
            el.style.opacity = '0';
            setTimeout(function () {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }, 300);
          }
        }, 350);
      });
    </script>
  </body>
</html>
